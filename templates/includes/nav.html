<!-- includes/nav.html -->
<nav id="site-nav" class="sticky top-0 z-50 w-full backdrop-blur border-b border-slate-800 bg-[#020617]/80 transform transition-transform duration-300" data-animate style="--anim-delay: 30ms;">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-1.5 rounded-lg shadow-lg shadow-blue-600/20">
                    <i class="fas fa-cloud text-white text-sm"></i>
                </div>
                <a href="/" class="font-bold text-xl text-white tracking-tight">CloudFree</a>
            </div>

            <!-- Desktop links -->
            <div class="hidden md:flex items-center gap-6">
                <a href="/" class="text-sm font-medium hover:text-blue-400 transition-colors">Inicio</a>
                <a href="/manuales/" class="text-sm font-medium hover:text-blue-400 transition-colors">Documentación</a>
                {% if user.is_authenticated %}
                    <a href="/admin/" class="text-sm bg-slate-800 px-4 py-2 rounded-lg hover:bg-slate-700 transition">Panel Admin</a>
                {% else %}
                    <a href="/accounts/registro/" class="text-sm bg-blue-600 px-4 py-2 rounded-lg text-white font-bold hover:bg-blue-500 transition shadow-lg shadow-blue-600/20">Unirse</a>
                {% endif %}
            </div>

            <!-- Mobile: hamburger -->
            <div class="md:hidden flex items-center">
                <button id="nav-toggle" aria-expanded="false" aria-controls="mobile-menu" class="p-2 rounded-md text-slate-200 hover:bg-slate-800/50 focus:outline-none">
                    <svg id="nav-open" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    <svg id="nav-close" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile menu, hidden by default -->
    <div id="mobile-menu" class="md:hidden hidden border-t border-slate-800 bg-[#020617]/95">
        <div class="px-4 pt-4 pb-6 space-y-2">
            <a href="/" class="block text-slate-200 px-3 py-2 rounded hover:bg-slate-800/40">Inicio</a>
            <a href="/manuales/" class="block text-slate-200 px-3 py-2 rounded hover:bg-slate-800/40">Documentación</a>
            {% if user.is_authenticated %}
                <a href="/admin/" class="block text-slate-200 px-3 py-2 rounded hover:bg-slate-800/40">Panel Admin</a>
            {% else %}
                <a href="/accounts/registro/" class="block text-white bg-blue-600 px-3 py-2 rounded font-bold">Unirse</a>
            {% endif %}
        </div>
    </div>

    <script>
        (function(){
            const btn = document.getElementById('nav-toggle');
            const menu = document.getElementById('mobile-menu');
            const openIcon = document.getElementById('nav-open');
            const closeIcon = document.getElementById('nav-close');
            if (!btn || !menu) return;
            btn.addEventListener('click', () => {
                menu.classList.toggle('hidden');
                const isOpen = !menu.classList.contains('hidden');
                btn.setAttribute('aria-expanded', String(isOpen));
                openIcon.classList.toggle('hidden');
                closeIcon.classList.toggle('hidden');
            });
        })();
    </script>
</nav>
